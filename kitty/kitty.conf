# include ~/.cache/wal/colors-kitty.conf

window_padding_width 24

background_blur 1

font_size		12.0

term xterm-256color


# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="Space Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
