# vim:ft=kitty

## name:     Nothing
## author:   balazsmihalyszabo
## license:  MIT
## blurb:    Pure black, monochrome, one red accent. Inspired by Nothing OS.

# ── Core ──────────────────────────────────────────────
foreground              #E8E8E8
background              #000000
selection_foreground    #000000
selection_background    #E8E8E8

# Cursor: the one red dot
cursor                  #D71921
cursor_text_color       #000000

url_color               #E8202A
url_style               dotted

# ── Readability guarantee ─────────────────────────────
# Whenever a program draws text on a background with less than WCAG AA
# contrast (4.5:1), kitty adjusts the text lightness until it is readable.
# Hue is preserved, so red stays red.
text_fg_override_threshold 4.5 ratio

# ── Window chrome ─────────────────────────────────────
active_border_color     #D71921
inactive_border_color   #262626
bell_border_color       #E8202A
visual_bell_color       #1A0000

wayland_titlebar_color  #000000
macos_titlebar_color    #000000

# ── Tab bar ───────────────────────────────────────────
tab_bar_background      #000000
tab_bar_margin_color    #000000
active_tab_foreground   #000000
active_tab_background   #EEEEEE
active_tab_font_style   bold
inactive_tab_foreground #7A7A7A
inactive_tab_background #000000
inactive_tab_font_style normal

# ── Marks ─────────────────────────────────────────────
mark1_foreground        #000000
mark1_background        #E8202A
mark2_foreground        #000000
mark2_background        #E8E8E8
mark3_foreground        #EEEEEE
mark3_background        #4D4D4D

# ── ANSI palette ──────────────────────────────────────
# Pure greyscale, with red as the only colour. Each grey has its own
# brightness, so different ANSI colours stay distinguishable. Every colour
# is at least 4.5:1 against the black background.

# black
color0   #000000
color8   #7A7A7A

# red: the accent (slightly brighter than #D71921 so text passes 4.5:1;
# black and white text on it also pass)
color1   #E8202A
color9   #FF4747

# green: pure white (diffs read as white = added, red = removed)
color2   #EEEEEE
color10  #EEEEEE

# yellow
color3   #D4D4D4
color11  #EBEBEB

# blue
color4   #9E9E9E
color12  #C2C2C2

# magenta
color5   #B0B0B0
color13  #D0D0D0

# cyan
color6   #C8C8C8
color14  #E0E0E0

# white
color7   #BDBDBD
color15  #FFFFFF
