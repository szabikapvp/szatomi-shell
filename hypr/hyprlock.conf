# Written by the shell from its current palette and wallpaper
source = $HOME/.cache/quickshell/hyprlock.conf

background {
    monitor =
    path = $wallpaper
    color = $background

    blur_size = 4
    blur_passes = 3 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Time

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-H:%M")"
    color = $text
    font_size = 128
    font_family = Space Grotesk Bold
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    font_family = Space Grotesk Bold

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true

    rounding = 25
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = $text
    fade_on_empty = true
    placeholder_text =  # Text rendered in the input box when it's empty.

    position = 0, 42
    halign = center
    valign = bottom
}
